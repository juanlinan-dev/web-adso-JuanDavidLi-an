<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>Inscripcion a Cursos Complementarios</h1>
        <form action="" class="formulario" id="formInscripcion" name="formInscripcion" method="post">
            <fieldset>
                <legend>Datos Personales</legend>
                <div class="campo">
                    
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" minlength="3"  required>
                    <small id="error-nombre" class="error"></small>
                </div>

                <div class="campo">
                    <label for="documento">Documento</label>
                    <input type="text" inputmode="numeric" id="documento" name="documento" required pattern="[0-9]{6,10}" title="6 a 10 dígitos">
                    <small id="error-documento" class="error"></small>
                    
                </div>

                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" required>
                    <small id="error-correo" class="error"></small>
                </div>
                <div class="campo">
                    <label for="telefono">Celular</label>
                    <input type="tel" id="telefono" name="telefono" required pattern="3[0-9]{9}" title="10 dígitos que empiecen por 3">
                    <small id="error-telefono" class="error"></small>
                </div>

                 <label for="jornada" class="opcion">
                        <input type="radio"  name="jornada" value="Mañana" checked>
                        Mañana
                    </label>
                    <label for="jornada" class="opcion">
                        <input type="radio"  name="jornada" value="Tarde">
                        Tarde
                    </label>
                    <label for="jornada" class="opcion">
                        <input type="radio"  name="jornada" value="Noche">
                        Noche
                    </label>
                    <small id="error-jornada" class="error"></small>

                    <label for="terminos" class="opcion">
                        <input type="checkbox" id="terminos" name="terminos" value="aceptado" required>
                        Autorizacion de datos
                    </label>

            </fieldset>

            <fieldset>

                <legend>Cursos</legend>
                <div class="campo">
                    <label for="Tipo">Tipo de Usuario:</label>
                    <select id="Tipo" name="Tipo" required>
                        <option value="">Elije una opción</option>
                        <option value="aprendiz">Aprendiz</option>
                        <option value="instructor">Instructor</option>
                        <option value="visitante">Visitante</option>
                    </select>
                </div>

                <br>
                <fieldset class="grupo">
                    <legend>Sede</legend>
                   
                   
                </fieldset>
                
                <fieldset class="grupo">
                    <legend>Temas que te interesan</legend>

                    <label for="novelas" class="opcion">
                        <input type="checkbox" id="novelas" name="temas" value="novelas">
                        Novelas
                    </label>

                    <label for="ciencia" class="opcion">
                        <input type="checkbox" id="ciencia" name="temas" value="ciencia">
                        Ciencia
                    </label>
                    

                </fieldset>
                <div class="campo">
                    <label for="comentario">¿Que libro te gustaria que tuvieramos?</label>
                    <textarea name="comentario" id="comentario" rows="4"></textarea>
                </div>
            </fieldset>
            <button type="submit" class="boton">Registrar</button>

        </form>

    </main>
</body>
</html>
