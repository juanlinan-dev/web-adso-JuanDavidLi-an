<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero - Tenis Zoe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">

        <header class="app-encabezado">
            <p class="logo">KTM</p>
        </header>

        <nav class="app-menu">
            <ul>
                <li><a href="#">📊 Resumen</a></li>
                <li><a href="#">📦 Inventario</a></li>
                <li><a href="#">🧾 Ventas</a></li>
                <li><a href="#">👥 Clientes</a></li>
            </ul>
        </nav>

        <main class="app-contenido">
            <h1>Resumen del día</h1>

            <section class="indicadores">
                <article class="indicador">
                    <p class="titulo">Ventas de hoy</p>
                    <p class="valor">$6.880.000</p>
                </article>
                <article class="indicador">
                    <p class="titulo">Motoscicletas vendidad</p>
                    <p class="valor">14</p>
                </article>
                <article class="indicador">
                    <p class="titulo">Modelos agotados</p>
                    <p class="valor">2</p>
                </article>
                <article class="indicador">
                    <p class="titulo">Clientes nuevos</p>
                    <p class="valor">6</p>
                </article>
            </section>

            <h2>Productos más vendidos</h2>

            <section class="galeria">
                <figure class="destacada">
                    <img src="img/125.jpeg" alt="Moto KTM SX" >
                    <figcaption>KTM 125 SX</figcaption>
                </figure>
                <figure class="agotado">
                    <img src="img/KTM200.png" alt="Moto KYM 200">
                    <span class="etiqueta-agotado">Agotado</span>
                    <figcaption>KTM 200</figcaption>
                </figure>
                <figure>
                    <img src="img/390.webp" alt="KTM 390">
                    <figcaption>KTM 390</figcaption>
                </figure>
                <figure>
                    <img src="img/390adventure.jpeg" alt="Moto KTM 390 adventure">
                    <figcaption>KTM 390 adventur</figcaption>
                </figure>
                <figure class="agotado">
                    <img src="img/390rc.jpeg" alt="Moto KTM 390 RC">
                    <span class="etiqueta-agotado">Agotado</span>
                    <figcaption>KTM 390 RC</figcaption>
                </figure>
                <figure>
                    <img src="img/790.jpeg" alt="Moto KTM 790">
                    <figcaption>KTM 790</figcaption>
                </figure>
                <figure class="destacada">
                    <img src="img/790adventure.jpeg" alt="Moto KTM 790 adventure">
                    <figcaption>KTM 790 adventure</figcaption>
                </figure>
                <figure class="agotado">
                    <img src="img/basicos blancos.jpg" alt="Tenis Basicos Blancos">
                    <span class="etiqueta-agotado">Agotado</span>
                    <figcaption>Basicos Blancos · 1 vendido</figcaption>
                </figure>
                <figure>
                    <img src="img/DC.jpg" alt="Tenis DC">
                    <figcaption>DC · 7 vendidos</figcaption>
                </figure>
                <figure>
                    <img src="img/1390.png" alt="KTM 1390 super duke">
                    <figcaption>KTM 1390 super duke</figcaption>
                </figure>
            </section>
        </main>

        <footer class="app-pie">
            <h1>Buena calidad al mejor precio</h1>
            <h2>Contactanos:</h2>
            <a href="https://wa.me/qr/XNNC6S5W4QDHC1">WhatsApp</a>
            <br>
            <a href="https://www.instagram.com/ls__m24?vrfl=OGs3Nnp6MTdqbzh6&utm_source=qr">Instagram</a>
            <br>
        </footer>

    </div>
</body>
</html>
