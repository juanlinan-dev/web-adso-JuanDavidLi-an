<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="estilo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>Registro de la biblioteca</h1>
        <form action="" class="formulario" method="post">
            <fieldset>
                <legend>Datos Personales</legend>
                <div class="campo">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <br>
                <div class="campo">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <br>
                <div class="campo">
                    <label for="nacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="nacimiento" name="nacimiento" min="1900-01-01" >
                </div>
                <br>
                <div class="campo">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" min="0" max="120">
                </div>
                <br>
                <div class="campo">
                    <label for="documento">Documento de Identidad:</label>
                    <input type="text" id="documento" name="documento">
                </div>
                <br>
                <div class="campo">
                    <label for="clave">Contraseña:</label>
                    <input type="password" id="clave" name="clave" required minlength="8">
                </div>
                

            </fieldset>

            <fieldset>

                <legend>Tu Perfil</legend>
                <div class="campo">
                    <label for="Tipo">Tipo de Usuario:</label>
                    <select id="Tipo" name="Tipo" required>
                        <option value="">Elije una opción</option>
                        <option value="aprendiz">Aprendiz</option>
                        <option value="instructor">Instructor</option>
                        <option value="visitante">Visitante</option>
                    </select>
                </div>

                <br>
                <fieldset class="grupo">
                    <legend>Sede</legend>
                    <label for="norte" class="opcion">
                        <input type="radio" id="norte" name="sede" value="norte" checked>
                        Norte
                    </label>
                    <label for="centro" class="opcion">
                        <input type="radio" id="centro" name="sede" value="centro">
                        Centro
                    </label>
                    <label for="sur" class="opcion">
                        <input type="radio" id="sur" name="sede" value="sur">
                        Sur
                    </label>
                   
                </fieldset>
                
                <fieldset class="grupo">
                    <legend>Temas que te interesan</legend>

                    <label for="novelas" class="opcion">
                        <input type="checkbox" id="novelas" name="temas" value="novelas">
                        Novelas
                    </label>

                    <label for="ciencia" class="opcion">
                        <input type="checkbox" id="ciencia" name="temas" value="ciencia">
                        Ciencia
                    </label>
                    <label for="tecnologia" class="opcion">
                        <input type="checkbox" id="" name="temas" value="tecnologia">
                        Tecnología
                    </label>

                </fieldset>
                <div class="campo">
                    <label for="comentario">¿Que libro te gustaria que tuvieramos?</label>
                    <textarea name="comentario" id="comentario" rows="4"></textarea>
                </div>
            </fieldset>
            <button type="submit" class="boton">Registrar</button>

        </form>

    </main>
</body>
</html>
