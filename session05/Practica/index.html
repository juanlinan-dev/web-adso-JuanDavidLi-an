<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>Registro de la biblioteca</h1>
        <form action="#" class="Formulario">
            <fieldset>
                <legend>Datos Personales</legend>
                <div class="campo">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>
                <br>
                <div class="campo">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo">
                </div>
                <br>
                <div class="campo">
                    <label for="nacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="nacimiento" name="nacimiento" min="1900-01-01" >
                </div>
                <br>
                <div class="campo">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" min="0" max="120">
                </div>
                <br>
                <div class="campo">
                    <label for="documento">Documento de Identidad:</label>
                    <input type="password" id="documento" name="documento">
                </div>
                <br>
                <div class="campo">
                    <label for="clave">Contraseña:</label>
                    <input type="password" id="clave" name="clave">
                </div>
                

            </fieldset>

            <fieldset>

                <legend>Tu Perfil</legend>
                <div class="campo">
                    <label for="Tipo">Tipo de Usuario:</label>
                    <select id="Tipo" name="Tipo">
                        <option value="">Elije una opción</option>
                        <option value="aprendiz">Aprendiz</option>
                        <option value="instructor">Instructor</option>
                        <option value="visitante">Visitante</option>
                    </select>
                </div>

                <br>
                <fieldset class="grupo">
                    <legend>Sede</legend>
                    <label for="norte">
                        <input type="radio" id="norte" name="sede" value="norte">
                        Norte
                    </label>
                    <label for="centro">
                        <input type="radio" id="centro" name="sede" value="centro">
                        Centro
                    </label>
                    <label for="sur">
                        <input type="radio" id="sur" name="sede" value="sur">
                        Sur
                    </label>
                   
                </fieldset>
            </fieldset>
            <button type="submit" class="boton">Registrar</button>

        </form>

    </main>
</body>
</html>
