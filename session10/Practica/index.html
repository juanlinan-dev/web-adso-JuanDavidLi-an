<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="kit.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main class="app-tareas tarjeta">
  <header class="app-tareas-encabezado">
    <h1>✅ Mis tareas</h1>
    <button class="boton boton-secundario" aria-label="Cambiar tema">🌙</button>
  </header>

  <form class="app-tareas-form">
    <label for="nuevaTarea" class="oculto-visual">Nueva tarea</label>
    <input type="text" id="nuevaTarea" placeholder="Escribe una tarea...">
    <button type="submit" class="boton">Agregar</button>
  </form>
  <p class="alerta alerta-error oculto">⚠️ Escribe algo antes de agregar.</p>

  <ul class="lista-tareas">
    <li class="tarea">
      <span>Estudiar para el quiz</span>
      <button class="boton boton-peligro" aria-label="Eliminar">🗑️</button>
    </li>
    <li class="tarea hecha">
      <span>Subir el reto</span>
      <button class="boton boton-peligro" aria-label="Eliminar">🗑️</button>
    </li>
    <li class="tarea ">
      <span>Subir la tarea</span>
      <button class="boton boton-peligro" aria-label="Eliminar">🗑️</button>
    </li>
    <li class="tarea ">
      <span>Pegarle a Dilan</span>
      <button class="boton boton-peligro" aria-label="Eliminar">🗑️</button>
    </li>
    <li class="tarea ">
      <span>Ganar el quiz</span>
      <button class="boton boton-peligro" aria-label="Eliminar">🗑️</button>
    </li>
  </ul>

  <p class="contador">1 pendiente de 5</p>
</main>
</body>
</html>
